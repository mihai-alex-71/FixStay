<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixStay – Host Dashboard</title>
    <link rel="stylesheet" href="style/style.css">
    <style>
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal-card { width: 100%; max-width: 460px; background: #fff; border-radius: 12px; padding: 20px; }
        .modal-form { display: grid; gap: 12px; }
        .modal-form input, .modal-form select { width: 100%; border: 1px solid #d8e1e7; border-radius: 8px; padding: 10px; }
        .property-image { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .btn-modal { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
        .btn-modal.primary { background: #7b2cbf; color: #fff; }
        .btn-modal.secondary { background: #eef3f6; color: #2f3a42; }
    </style>
</head>

<body>

<header>
    <h2 class="logo"><a href="index.html">Fix<span>Stay</span></a></h2>
    <nav class="navigation" id="navMenu">
        <a href="index.html">Home</a>
        <button class="btnLogin-popup" onclick="location.href='login.html'">Logout</button>
    </nav>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</header>

<div class="dashboard-page">
    <div class="dash-layout">

        <aside class="sidebar">
            <span class="sidebar-label">Host Menu</span>
            <a class="sidebar-item active" href="#">Overview</a>
            <a class="sidebar-item" href="#">My Properties</a>
            <a class="sidebar-item" href="#">Maintenance Tasks</a>
            <a class="sidebar-item" href="login.html">Logout</a>
        </aside>

        <main class="dash-content">
            <div class="dash-greeting"><h2 id="hostGreeting"></h2></div>

            <div class="dash-panel">
                <div class="dash-panel-header">
                    <h3>Active Maintenance Tasks</h3>
                    <button class="btn-sm outline" id="openAddIssueModal">+ Add New Task</button>
                </div>
                <div class="task-list" id="issueList"></div>
                <div class="property-empty" id="issueEmpty" style="display: none;">No requests.</div>
            </div>

            <div class="dash-panel">
                <div class="dash-panel-header">
                    <h3>My Properties</h3>
                    <button class="btn-sm outline" id="openAddPropertyModal">+ Add Property</button>
                </div>
                <div class="task-list" id="propertyList"></div>
                <div class="property-empty" id="propertyEmpty">No properties added.</div>
            </div>
        </main>
    </div>
</div>

<div class="modal-overlay" id="chatModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; max-width: 500px;">
        <div style="background: linear-gradient(135deg, #7b2cbf 0%, #5a189a 100%); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h4 id="chatModalTitle" style="margin: 0; color: white;">Chat</h4>
                <span id="chatPropertySubtitle" style="font-size: 12px; opacity: 0.8;">Conversație</span>
            </div>
            <button onclick="closeChatModal()" style="background: none; border: none; color: white; cursor: pointer; font-size: 24px;">&times;</button>
        </div>
        <div id="host-chat-messages" style="height: 350px; overflow-y: auto; background-color: #f8f9fa; padding: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
        <div style="padding: 15px 20px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px;">
            <input type="text" id="hostChatInput" placeholder="Type a message..." style="flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1;">
            <button onclick="sendHostChatMessage()" class="btn-modal primary">Send</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addPropertyModal" aria-hidden="true">
    <div class="modal-card">
        <h4>Add Property</h4>
        <form id="addPropertyForm" class="modal-form">
            <input type="text" id="propertyName" placeholder="Name" required>
            <select id="propertyAddress" required><option value="Cluj-Napoca">Cluj-Napoca</option></select>
            <input type="number" id="propertyPrice" value="10" required>
            <input type="file" id="propertyImage">
            <button type="submit" class="btn-modal primary">Save</button>
            <button type="button" class="btn-modal secondary" id="cancelAddProperty">Cancel</button>
        </form>
    </div>
</div>

<script>
    const firstName = localStorage.getItem('firstName');
    const hostEmail = localStorage.getItem('loggedInEmail') || localStorage.getItem('email');
    if (!hostEmail) { location.href = 'login.html'; }
    document.getElementById('hostGreeting').textContent = `Welcome, ${firstName}!`;

    async function renderProperties() {
        const response = await fetch(`http://localhost:8080/api/properties/get-properties?email=${encodeURIComponent(hostEmail)}`);
        const properties = await response.json();
        const list = document.getElementById('propertyList'); list.innerHTML = '';
        if(properties.length===0) return;
        document.getElementById('propertyEmpty').style.display = 'none';
        properties.forEach(p => {
            const item = document.createElement('div'); item.className = 'task-item';
            item.innerHTML = `
                    <div class="task-info"><strong>${p.name}</strong> · ${p.address}</div>
                    <button onclick="openChatWithGuest(${p.id}, '${p.name}')" class="btn-sm outline" style="color:#7b2cbf; border-color:#7b2cbf;">Message Guest</button>
                `;
            list.appendChild(item);
        });
    }

    // --- AUTOMATIZARE COMPLETĂ CHAT (FĂRĂ PROMPT) ---
    const chatModal = document.getElementById('chatModal');
    let currentChatGuestEmail = null; let chatRefreshInterval = null;

    function closeChatModal() { chatModal.classList.remove('show'); if(chatRefreshInterval) clearInterval(chatRefreshInterval); currentChatGuestEmail = null; }

    async function openChatWithGuest(propertyId, propertyName) {
        try {
            // Întrebăm direct noul endpoint din Java cine e chiriașul activ. Gata cu prompt()!
            const response = await fetch(`http://localhost:8080/api/rentals/active-guest?propertyId=${propertyId}`);
            if (!response.ok) { alert("This property does not have an active guest right now."); return; }

            currentChatGuestEmail = await response.text(); // Primim direct email-ul chiriașului

            document.getElementById('chatModalTitle').textContent = `Chat with Guest`;
            document.getElementById('chatPropertySubtitle').textContent = propertyName;
            chatModal.classList.add('show');

            loadHostChat();
            if (chatRefreshInterval) clearInterval(chatRefreshInterval);
            chatRefreshInterval = setInterval(loadHostChat, 3000);
        } catch (e) { alert("Error opening chat."); }
    }

    async function loadHostChat() {
        if (!hostEmail || !currentChatGuestEmail) return;
        const response = await fetch(`http://localhost:8080/api/messages/conversation?user1=${hostEmail}&user2=${currentChatGuestEmail}`);
        const messages = await response.json();
        const chatBox = document.getElementById('host-chat-messages'); chatBox.innerHTML = "";
        messages.forEach(msg => {
            const isMe = msg.sender.emailAddress === hostEmail;
            chatBox.innerHTML += `<div style="align-self: ${isMe?'flex-end':'flex-start'}; background:${isMe?'#7b2cbf':'#e2e8f0'}; color:${isMe?'white':'#333'}; padding:10px; border-radius:10px;">${msg.content}</div>`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendHostChatMessage() {
        const input = document.getElementById('hostChatInput'); if(!input.value.trim() || !currentChatGuestEmail) return;
        await fetch("http://localhost:8080/api/messages/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ senderEmail: hostEmail, receiverEmail: currentChatGuestEmail, content: input.value }) });
        input.value = ""; loadHostChat();
    }

    document.getElementById('hostChatInput').addEventListener('keypress', (e) => { if(e.key==='Enter') sendHostChatMessage(); });

    document.getElementById('openAddPropertyModal').addEventListener('click', () => document.getElementById('addPropertyModal').classList.add('show'));
    document.getElementById('cancelAddProperty').addEventListener('click', () => document.getElementById('addPropertyModal').classList.remove('show'));

    renderProperties();
</script>
</body>
</html>
